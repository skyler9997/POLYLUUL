<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行銷成效儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root{
    --bg: #10131A;
    --panel: #171B25;
    --panel-2: #1D2230;
    --border: #2A3040;
    --text: #ECEEF3;
    --text-dim: #8B93A7;
    --text-faint: #5B6376;
    --amber: #E8A33D;
    --amber-dim: #40331D;
    --good: #4ADE80;
    --good-dim: #17301F;
    --bad: #F87171;
    --bad-dim: #391C1C;
    --c-ga4: #4F9DE8;
    --c-meta: #7C7CF0;
    --c-google: #4ADE80;
    --c-line: #3ED6C5;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif; font-size:14px; line-height:1.6;
    padding:32px 40px 80px;
  }
  h1,h2,h3{font-family:'Space Grotesk',sans-serif; font-weight:600; margin:0;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .topbar{
    display:flex; justify-content:space-between; align-items:flex-end;
    margin-bottom:28px; flex-wrap:wrap; gap:16px;
    border-bottom:1px solid var(--border); padding-bottom:20px;
  }
  .topbar h1{font-size:22px; letter-spacing:-0.02em;}
  .topbar .eyebrow{color:var(--amber); font-size:12px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:6px; font-weight:600;}
  .controls{display:flex; gap:10px; align-items:center;}
  select{
    background:var(--panel-2); color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:8px 12px; font-family:'Inter',sans-serif; font-size:13px;
  }
  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:32px;}
  .kpi-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px;
  }
  .kpi-label{color:var(--text-dim); font-size:12px; margin-bottom:10px;}
  .kpi-value{font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:700; letter-spacing:-0.01em;}
  .kpi-delta{display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:600; margin-top:8px; padding:2px 8px; border-radius:20px;}
  .delta-good{background:var(--good-dim); color:var(--good);}
  .delta-bad{background:var(--bad-dim); color:var(--bad);}
  .delta-flat{background:var(--panel-2); color:var(--text-dim);}
  .kpi-spark{margin-top:10px; height:32px;}

  .section{margin-bottom:36px;}
  .section-head{display:flex; align-items:baseline; gap:8px 16px; margin-bottom:14px; flex-wrap:wrap;}
  .section-head h2{font-size:16px;}
  .section-head .n{color:var(--text-faint); font-size:12px;}

  .chart-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .chart-card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px;}
  .chart-card h3{font-size:13px; color:var(--text-dim); font-weight:500; margin-bottom:12px;}
  .chart-wrap{position:relative; height:220px;}
  .legend{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:10px; font-size:12px; color:var(--text-dim);}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .dot{width:9px; height:9px; border-radius:2px; display:inline-block;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  .block{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:14px;}
  .block-title{background:var(--panel-2); color:var(--amber); font-weight:600; font-size:12.5px; padding:10px 16px; letter-spacing:0.02em;}
  td, th{padding:9px 16px; border-top:1px solid var(--border); text-align:center; vertical-align:middle;}
  td:first-child, th:first-child{text-align:left; color:var(--text-dim); font-weight:500;}
  th{color:var(--text-faint); font-weight:500; font-size:11.5px; text-transform:uppercase; letter-spacing:0.04em;}
  .val{font-family:'JetBrains Mono',monospace;}
  .chg{font-family:'JetBrains Mono',monospace; font-weight:600; padding:2px 8px; border-radius:20px; font-size:12px; display:inline-block; min-width:56px;}

  .foot-note{color:var(--text-faint); font-size:12px; margin-top:30px; border-top:1px solid var(--border); padding-top:16px;}

  .funnel{display:flex; flex-direction:column; gap:2px; padding:8px 0;}
  .funnel-seg{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:100%; height:64px; text-align:center; color:#1B1F16;
  }
  .funnel-seg .fs-label{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px;}
  .funnel-seg .fs-sub{font-size:11px; opacity:.75; margin-top:1px;}
  .funnel-seg .fs-val{font-family:'JetBrains Mono',monospace; font-size:11.5px; margin-top:3px; font-weight:700;}
  @media (max-width:900px){
    .kpi-grid{grid-template-columns:repeat(2,1fr);}
    .chart-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="eyebrow">Marketing performance</div>
    <h1>行銷成效儀表板</h1>
  </div>
  <div class="controls">
    <label style="color:var(--text-dim); font-size:12px;">從</label>
    <select id="startWeekSelect"></select>
    <label style="color:var(--text-dim); font-size:12px;">到</label>
    <select id="endWeekSelect"></select>
  </div>
</div>

<div class="kpi-grid" id="kpiGrid"></div>

<div class="section">
  <div class="section-head"><h2>GA4 購物漏斗</h2><span class="n" id="funnelLabel">選取區間「到」的那一週</span></div>
  <div class="chart-card">
    <div id="funnelWrap"></div>
  </div>
</div>

<div class="section">
  <div class="section-head"><h2>多週趨勢</h2><span class="n">依選取區間顯示</span></div>
  <div class="chart-grid">
    <div class="chart-card">
      <h3>各平台花費趨勢</h3>
      <div class="chart-wrap"><canvas id="spendChart" role="img" aria-label="各平台廣告花費隨週次變化的折線圖"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>各平台 ROAS 趨勢</h3>
      <div class="chart-wrap"><canvas id="roasChart" role="img" aria-label="各平台 ROAS 隨週次變化的折線圖"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>官網營業額與訂單數趨勢</h3>
      <div class="chart-wrap"><canvas id="revenueChart" role="img" aria-label="官網成交營業額與訂單數隨週次變化的折線圖"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>GA4 購物漏斗轉換率趨勢</h3>
      <div class="chart-wrap"><canvas id="funnelChart" role="img" aria-label="GA4 購物漏斗各階段轉換率隨週次變化的折線圖"></canvas></div>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-head">
    <h2>兩週比較明細</h2>
    <span class="n" id="compareLabel"></span>
    <div class="controls" style="margin-left:auto; align-self:center;">
      <label style="color:var(--text-dim); font-size:12px;">週次 A</label>
      <select id="compareWeekA"></select>
      <label style="color:var(--text-dim); font-size:12px;">週次 B</label>
      <select id="compareWeekB"></select>
    </div>
  </div>
  <div id="tables"></div>
</div>

<div class="foot-note">
  資料來源：GA4 / Meta Ads / Google Ads / LINE Ads，由 run_weekly_pull.py 產生。
  綠色代表朝好的方向變化，紅色代表朝壞的方向變化（成本類指標下降為好，花費/轉換/ROAS 類指標上升為好）。
</div>

<script src="dashboard_data.js"></script>
<script>
const DATA = (window.DASHBOARD_DATA && window.DASHBOARD_DATA.weeks) || [];
const fmt = (n, digits=0) => {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('zh-TW', {maximumFractionDigits: digits, minimumFractionDigits: digits});
};
const fmtMoney = (n) => n===null||n===undefined ? '—' : 'NT$'+fmt(n);
const fmtPct = (n) => n===null||n===undefined ? '—' : fmt(n,2)+'%';

// 指標方向：true = 數值上升是好事，false = 數值下降是好事
const LOWER_IS_BETTER = ['成本','CPA','CPC','CPM'];
function isLowerBetter(name){ return LOWER_IS_BETTER.some(k => name.includes(k)); }
// 名稱中帶「%」的指標本身就是百分比（例如轉換率、CTR），區間變化改用「直接相減」的百分點差，
// 而不是「相對成長率」，避免看起來很怪（例如 60.53% 漲到 63.82%，相對成長率會顯示 +5.4%，
// 但實際上只是漲了 3.29 個百分點）
function isPercentMetric(name){ return name.includes('%'); }

function pctChange(curr, prev){
  if (curr===null||curr===undefined||prev===null||prev===undefined||prev===0) return null;
  return (curr-prev)/Math.abs(prev)*100;
}

// curr = 較晚/第二欄的值，prev = 較早/第一欄的值（跟原本語意一致）
function deltaBadge(curr, prev, metricName){
  const lowerBetter = isLowerBetter(metricName);
  if (isPercentMetric(metricName)){
    if (curr===null||curr===undefined||prev===null||prev===undefined) return `<span class="chg delta-flat">—</span>`;
    const diff = prev - curr; // 週次A（第一欄）剪掉週次B（第二欄）
    const flat = Math.abs(diff) < 0.05;
    const improved = lowerBetter ? diff > 0 : diff < 0; // diff>0 代表 B 比 A 低
    const cls = flat ? 'delta-flat' : (improved ? 'delta-good' : 'delta-bad');
    const sign = diff > 0 ? '+' : '';
    return `<span class="chg ${cls}">${sign}${fmt(diff,2)}pt</span>`;
  }
  const chg = pctChange(curr, prev);
  if (chg === null) return `<span class="chg delta-flat">—</span>`;
  const improved = lowerBetter ? chg < 0 : chg > 0;
  const flat = Math.abs(chg) < 0.5;
  const cls = flat ? 'delta-flat' : (improved ? 'delta-good' : 'delta-bad');
  const sign = chg > 0 ? '+' : '';
  return `<span class="chg ${cls}">${sign}${fmt(chg,1)}%</span>`;
}

// ---------- date range selectors ----------
const startWeekSelect = document.getElementById('startWeekSelect');
const endWeekSelect = document.getElementById('endWeekSelect');
DATA.forEach((w, i) => {
  const label = `${w.week_start} ~ ${w.week_end}`;
  const opt1 = document.createElement('option'); opt1.value = i; opt1.textContent = label;
  startWeekSelect.appendChild(opt1);
  const opt2 = document.createElement('option'); opt2.value = i; opt2.textContent = label;
  endWeekSelect.appendChild(opt2);
});
const defaultStart = Math.max(0, DATA.length - 8); // 預設顯示最近 8 週
startWeekSelect.value = defaultStart;
endWeekSelect.value = DATA.length - 1;

function onRangeChange(){
  let s = parseInt(startWeekSelect.value), e = parseInt(endWeekSelect.value);
  if (s > e) { // 自動修正順序
    [s, e] = [e, s];
  }
  renderAll(s, e);
}
startWeekSelect.addEventListener('change', onRangeChange);
endWeekSelect.addEventListener('change', onRangeChange);

// ---------- 兩週比較：獨立的週次選擇（不影響上方 KPI / 趨勢圖 / 漏斗）----------
const compareWeekA = document.getElementById('compareWeekA');
const compareWeekB = document.getElementById('compareWeekB');
DATA.forEach((w, i) => {
  const label = `${w.week_start} ~ ${w.week_end}`;
  const optA = document.createElement('option'); optA.value = i; optA.textContent = label;
  compareWeekA.appendChild(optA);
  const optB = document.createElement('option'); optB.value = i; optB.textContent = label;
  compareWeekB.appendChild(optB);
});
compareWeekA.value = Math.max(0, DATA.length - 2);
compareWeekB.value = DATA.length - 1;

function onCompareChange(){
  let a = parseInt(compareWeekA.value), b = parseInt(compareWeekB.value);
  renderComparison(a, b); // a=週次A（起始欄), b=週次B（結束欄), 允許任意先後順序
}
compareWeekA.addEventListener('change', onCompareChange);
compareWeekB.addEventListener('change', onCompareChange);

// ---------- KPI cards ----------
function sparkline(canvasId, series, color){
  new Chart(document.getElementById(canvasId), {
    type: 'line',
    data: { labels: series.map((_,i)=>i), datasets: [{ data: series, borderColor: color, borderWidth: 2, pointRadius: 0, tension: 0.35, fill: false }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display:false }, tooltip: { enabled:false } },
      scales: { x: { display:false }, y: { display:false } },
      elements: { line: { borderJoinStyle: 'round' } }
    }
  });
}

function sumBy(slice, getter){
  let total = null;
  slice.forEach(w => { const v = getter(w); if (v !== null && v !== undefined && !isNaN(v)) { total = (total||0) + v; } });
  return total;
}

function renderKPIs(startIdx, endIdx){
  const grid = document.getElementById('kpiGrid');
  grid.innerHTML = '';
  const slice = DATA.slice(startIdx, endIdx+1);
  const rangeLen = endIdx - startIdx + 1;
  // 上一個等長區間，用來算「區間變化」
  const prevStart = Math.max(0, startIdx - rangeLen);
  const prevEnd = startIdx - 1;
  const prevSlice = prevEnd >= prevStart ? DATA.slice(prevStart, prevEnd+1) : [];

  const spendSum = sumBy(slice, w=>w.combined?.總花費);
  const revenueSum = sumBy(slice, w=>w.ga4?.成交營業額);
  const ordersSum = sumBy(slice, w=>w.ga4?.成交訂單數);
  // 用花費*ROAS 還原轉換值加總，再算區間 ROAS（比單純平均週 ROAS 準確）
  const convValueSum = sumBy(slice, w => (w.combined?.總花費!=null && w.combined?.總ROAS!=null) ? w.combined.總花費*w.combined.總ROAS : null);
  const roasAgg = (spendSum && convValueSum!=null) ? convValueSum/spendSum : null;
  const cpaAgg = (ordersSum) ? spendSum/ordersSum : null;

  const pSpendSum = sumBy(prevSlice, w=>w.combined?.總花費);
  const pRevenueSum = sumBy(prevSlice, w=>w.ga4?.成交營業額);
  const pOrdersSum = sumBy(prevSlice, w=>w.ga4?.成交訂單數);
  const pConvValueSum = sumBy(prevSlice, w => (w.combined?.總花費!=null && w.combined?.總ROAS!=null) ? w.combined.總花費*w.combined.總ROAS : null);
  const pRoasAgg = (pSpendSum && pConvValueSum!=null) ? pConvValueSum/pSpendSum : null;
  const pCpaAgg = (pOrdersSum) ? pSpendSum/pOrdersSum : null;

  const cards = [
    { label:'總花費（區間加總）', val: fmtMoney(spendSum), curr:spendSum, prev:pSpendSum, name:'總花費', series: slice.map(w=>w.combined?.總花費||0), color:'#E8A33D' },
    { label:'總 ROAS（區間）', val: fmt(roasAgg,2), curr:roasAgg, prev:pRoasAgg, name:'ROAS', series: slice.map(w=>w.combined?.總ROAS||0), color:'#4ADE80' },
    { label:'官網成交營業額（區間加總）', val: fmtMoney(revenueSum), curr:revenueSum, prev:pRevenueSum, name:'成交營業額', series: slice.map(w=>w.ga4?.成交營業額||0), color:'#4F9DE8' },
    { label:'整體 CPA（區間）', val: fmtMoney(cpaAgg), curr:cpaAgg, prev:pCpaAgg, name:'整體CPA', series: slice.map(w=>w.combined?.整體CPA||0), color:'#F87171' },
  ];
  cards.forEach((c,i) => {
    const div = document.createElement('div');
    div.className = 'kpi-card';
    div.innerHTML = `
      <div class="kpi-label">${c.label}</div>
      <div class="kpi-value">${c.val}</div>
      ${deltaBadgeKPI(c.curr, c.prev, c.name)}
      <div class="kpi-spark"><canvas id="spark${i}"></canvas></div>
    `;
    grid.appendChild(div);
  });
  cards.forEach((c,i) => sparkline(`spark${i}`, c.series, c.color));
}
function deltaBadgeKPI(curr, prev, name){
  return `<div>${deltaBadge(curr, prev, name)} <span style="color:var(--text-faint); font-size:11px;">vs 前一個等長區間</span></div>`;
}

// ---------- trend charts ----------
function lineDataset(label, data, color){
  return { label, data, borderColor: color, backgroundColor: color, borderWidth: 2, pointRadius: 3, pointBackgroundColor: color, tension: 0.3 };
}
let charts = {}; // 保存 Chart 實例，切換區間時需要 destroy 重畫
function destroyChart(id){ if (charts[id]) { charts[id].destroy(); delete charts[id]; } }

function renderTrendCharts(startIdx, endIdx){
  const slice = DATA.slice(startIdx, endIdx+1);
  const weekLabels = slice.map(w => w.week_start.slice(5));

  ['spendChart','roasChart','revenueChart','funnelChart'].forEach(destroyChart);

  charts.spendChart = new Chart(document.getElementById('spendChart'), {
    type:'line',
    data:{ labels: weekLabels, datasets:[
      lineDataset('Meta', slice.map(w=>w.meta?.整體?.花費??null), '#7C7CF0'),
      lineDataset('Google Ads', slice.map(w=>w.google_ads?.花費??null), '#4ADE80'),
      lineDataset('LINE', slice.map(w=>w.line_ads?.總花費??null), '#3ED6C5'),
    ]},
    options: trendOptions('NT$')
  });
  charts.roasChart = new Chart(document.getElementById('roasChart'), {
    type:'line',
    data:{ labels: weekLabels, datasets:[
      lineDataset('Meta', slice.map(w=>w.meta?.整體?.ROAS??null), '#7C7CF0'),
      lineDataset('Google Ads', slice.map(w=>w.google_ads?.ROAS??null), '#4ADE80'),
      lineDataset('LINE', slice.map(w=>w.line_ads?.ROAS??null), '#3ED6C5'),
      lineDataset('總 ROAS', slice.map(w=>w.combined?.總ROAS??null), '#E8A33D'),
    ]},
    options: trendOptions('')
  });
  charts.revenueChart = new Chart(document.getElementById('revenueChart'), {
    type:'line',
    data:{ labels: weekLabels, datasets:[
      lineDataset('成交營業額', slice.map(w=>w.ga4?.成交營業額??null), '#4F9DE8'),
    ]},
    options: trendOptions('NT$', true)
  });
  charts.funnelChart = new Chart(document.getElementById('funnelChart'), {
    type:'line',
    data:{ labels: weekLabels, datasets:[
      lineDataset('放進購物車%', slice.map(w=>w.ga4?.["有放進購物車的工作階段%"]??null), '#E8A33D'),
      lineDataset('結帳%', slice.map(w=>w.ga4?.["有結帳的工作階段%"]??null), '#7C7CF0'),
      lineDataset('真實交易%', slice.map(w=>w.ga4?.["真實交易工作階段%"]??null), '#4ADE80'),
    ]},
    options: trendOptions('%')
  });
}

// ---------- GA4 funnel（梯形漏斗，依選取區間加總後重新計算轉換率）----------
function renderFunnelBar(startIdx, endIdx){
  const slice = DATA.slice(startIdx, endIdx+1);
  const rangeLabel = slice.length > 1
    ? `${slice[0].week_start} ~ ${slice[slice.length-1].week_end}（區間加總後重新計算轉換率）`
    : `${slice[0].week_start} ~ ${slice[0].week_end}`;
  document.getElementById('funnelLabel').textContent = rangeLabel;

  // 用區間內每週的「page_view」加總當分母，反推各階段人次總和，重新計算轉換率
  const pageViewSum = sumBy(slice, w=>w.ga4?.page_view) || 0;
  const viewItemSum = sumBy(slice, w=>w.ga4?.view_item) || 0;
  const addToCartSum = sumBy(slice, w=>w.ga4?.add_to_cart) || 0;
  const beginCheckoutSum = sumBy(slice, w=>w.ga4?.begin_checkout) || 0;
  const purchaseSum = sumBy(slice, w=>w.ga4?.purchase) || 0;
  // 真實交易率直接用「成交訂單數」（官網實際成交訂單）當人次，不再用百分比反推
  const realTxnCountSum = sumBy(slice, w=>w.ga4?.成交訂單數);

  const pct = (n) => pageViewSum ? n/pageViewSum*100 : null;
  const stages = [
    { label:'頁面瀏覽', sub:'page_view', pct:100 },
    { label:'商品瀏覽率', sub:'（商品瀏覽 ÷ page_view）', pct:pct(viewItemSum) },
    { label:'加車率', sub:'（加入購物車 ÷ page_view）', pct:pct(addToCartSum) },
    { label:'結帳進入率', sub:'（開始結帳 ÷ page_view）', pct:pct(beginCheckoutSum) },
    { label:'購買率（GA）', sub:'（發生交易 ÷ page_view）', pct:pct(purchaseSum) },
    { label:'真實交易率', sub:'（成交訂單數 ÷ page_view）', pct:pct(realTxnCountSum) },
  ];

  const colors = ['#B9D4AE','#A9CBA0','#D9CE8E','#E3B98A','#E3987E','#D97C77'];
  const maxWidthPct = 96, minWidthPct = 18;
  // 用開根號縮放：讓小百分比之間的差異也看得出漸縮效果，而不是全部擠在最小寬度
  const widths = stages.map(s => minWidthPct + (maxWidthPct-minWidthPct) * Math.sqrt((s.pct ?? 0)/100));
  // 漏斗形狀強制單調遞減（視覺寬度不會因為後段數字略高於前段而凸出去，
  // 例如「真實交易率」有時會因為統計口徑不同而略高於「購買率(GA)」，
  // 但漏斗本身仍應維持逐層收窄的視覺邏輯，真實百分比數字仍照實顯示）
  for (let i = 1; i < widths.length; i++){
    widths[i] = Math.min(widths[i], widths[i-1]);
  }

  const rows = stages.map((s, i) => {
    const topW = widths[i];
    const botW = widths[i+1] ?? Math.max(minWidthPct*0.7, widths[i]-6);
    const clip = `polygon(${(50-topW/2)}% 0%, ${(50+topW/2)}% 0%, ${(50+botW/2)}% 100%, ${(50-botW/2)}% 100%)`;
    return `<div class="funnel-seg" style="background:${colors[i]}; clip-path:${clip};">
      <div class="fs-label">${s.label}</div>
      <div class="fs-sub">${s.sub}</div>
      <div class="fs-val">${fmt(s.pct,2)}%</div>
    </div>`;
  }).join('');

  document.getElementById('funnelWrap').innerHTML = `<div class="funnel">${rows}</div>`;
}
function trendOptions(unit, singleAxis){
  return {
    responsive:true, maintainAspectRatio:false,
    interaction: { mode:'index', intersect:false },
    plugins: {
      legend: { display:true, labels:{ color:'#8B93A7', usePointStyle:true, boxWidth:8, font:{size:11} } },
      tooltip: {
        callbacks: { label: (ctx) => `${ctx.dataset.label}: ${unit==='NT$' ? 'NT$'+Math.round(ctx.parsed.y).toLocaleString() : (unit==='%' ? ctx.parsed.y+'%' : Math.round(ctx.parsed.y*100)/100)}` }
      }
    },
    scales: {
      x: { grid:{ color:'#2A3040' }, ticks:{ color:'#5B6376', font:{size:11} } },
      y: { grid:{ color:'#2A3040' }, ticks:{ color:'#5B6376', font:{size:11} } }
    }
  };
}

// ---------- comparison table ----------
function metricRow(label, currObj, prevObj, key, isMoney){
  const c = currObj ? currObj[key] : null;
  const p = prevObj ? prevObj[key] : null;
  const fmtVal = (v) => isMoney ? fmtMoney(v) : (typeof v === 'number' ? fmt(v, Number.isInteger(v)?0:2) : (v ?? '—'));
  return `<tr><td>${label}</td><td class="val">${fmtVal(p)}</td><td class="val">${fmtVal(c)}</td><td>${deltaBadge(c,p,label)}</td></tr>`;
}

function block(title, rows, startLabel, endLabel){
  return `<div class="block"><div class="block-title">${title}</div><table>
    <tr><th>指標</th><th>${startLabel}</th><th>${endLabel}</th><th>區間變化</th></tr>
    ${rows}
  </table></div>`;
}

function renderComparison(idxA, idxB){
  const a = DATA[idxA], b = DATA[idxB]; // a=週次A（第一欄），b=週次B（第二欄），不自動排序，照使用者選的順序顯示
  const curr = b, prev = a; // metricRow / deltaBadge 沿用 curr=第二欄, prev=第一欄 的語意
  const startLabel = a.week_start.slice(5)+'~'+a.week_end.slice(5);
  const endLabel = b.week_start.slice(5)+'~'+b.week_end.slice(5);
  document.getElementById('compareLabel').textContent = (a !== b) ? `週次A ${a.week_start}~${a.week_end}　vs　週次B ${b.week_start}~${b.week_end}` : `${a.week_start}~${a.week_end}`;

  let html = '';

  // 官網營業指標 + 總廣告成效
  html += block('官網營業指標 / 總廣告成效', [
    metricRow('成交營業額', curr.ga4, prev?.ga4, '成交營業額', true),
    metricRow('成交訂單數', curr.ga4, prev?.ga4, '成交訂單數'),
    metricRow('成交訂單客單', curr.ga4, prev?.ga4, '成交訂單客單', true),
    metricRow('整體CPA', curr.combined, prev?.combined, '整體CPA', true),
    metricRow('總花費', curr.combined, prev?.combined, '總花費', true),
    metricRow('GA4整體CPC', curr.combined, prev?.combined, 'GA4整體CPC', true),
    metricRow('總ROAS', curr.combined, prev?.combined, '總ROAS'),
  ].join(''), startLabel, endLabel);

  // GA4 漏斗
  html += block('GA4 事件漏斗 / 購物漏斗%', [
    metricRow('工作階段數', curr.ga4, prev?.ga4, '工作階段數'),
    metricRow('page_view', curr.ga4, prev?.ga4, 'page_view'),
    metricRow('view_item', curr.ga4, prev?.ga4, 'view_item'),
    metricRow('add_to_cart', curr.ga4, prev?.ga4, 'add_to_cart'),
    metricRow('begin_checkout', curr.ga4, prev?.ga4, 'begin_checkout'),
    metricRow('purchase', curr.ga4, prev?.ga4, 'purchase'),
    metricRow('有瀏覽產品的工作階段%', curr.ga4, prev?.ga4, '有瀏覽產品的工作階段%'),
    metricRow('有放進購物車的工作階段%', curr.ga4, prev?.ga4, '有放進購物車的工作階段%'),
    metricRow('有結帳的工作階段%', curr.ga4, prev?.ga4, '有結帳的工作階段%'),
    metricRow('發生交易的工作階段%(GA)', curr.ga4, prev?.ga4, '發生交易的工作階段%(GA)'),
    metricRow('真實交易工作階段%', curr.ga4, prev?.ga4, '真實交易工作階段%'),
    metricRow('購物車交易人次', curr.ga4, prev?.ga4, '購物車交易人次'),
  ].join(''), startLabel, endLabel);

  // Meta 各區塊
  const metaSegments = ['整體','新客','知名度_門市','再行銷','海外_港澳'];
  metaSegments.forEach(seg => {
    const c = curr.meta?.[seg], p = prev?.meta?.[seg];
    if (!c) return;
    const rows = Object.keys(c).map(k => {
      const isMoney = ['花費','購物車成本','轉換成本','轉換值','客單價','CPM'].includes(k);
      return metricRow(k, c, p, k, isMoney);
    }).join('');
    html += block(`FB 廣告數據 — ${seg.replace('_',' / ')}`, rows, startLabel, endLabel);
  });

  // Google Ads
  if (curr.google_ads){
    const rows = Object.keys(curr.google_ads).map(k => {
      const isMoney = ['花費','購物車成本','轉換成本','轉換值','客單價'].includes(k);
      return metricRow(k, curr.google_ads, prev?.google_ads, k, isMoney);
    }).join('');
    html += block('Google 廣告數據', rows, startLabel, endLabel);
  }

  // LINE Ads
  if (curr.line_ads){
    const rows = Object.keys(curr.line_ads).map(k => {
      const isMoney = ['總花費','CPF花費','CPF成本','轉換花費','轉換成本','轉換值','客單價'].includes(k);
      return metricRow(k, curr.line_ads, prev?.line_ads, k, isMoney);
    }).join('');
    html += block('LINE 廣告數據', rows, startLabel, endLabel);
  }

  document.getElementById('tables').innerHTML = html;
}

// ---------- render everything for a given [startIdx, endIdx] range ----------
function renderAll(startIdx, endIdx){
  renderKPIs(startIdx, endIdx);
  renderTrendCharts(startIdx, endIdx);
  renderFunnelBar(startIdx, endIdx);

}

  renderAll(parseInt(startWeekSelect.value), parseInt(endWeekSelect.value));

}
